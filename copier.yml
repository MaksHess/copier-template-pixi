# configuration
_subdirectory: template
_preserve_symlinks: True
_min_copier_version: "9.3.1"

# questions
project_slug:
  type: str
  help: What is your project slug (i.e. pypi package name)?
  default: copier-pixi
  validator: >-
    {% if '_' in project_slug or ' ' in project_slug or '.' in project_slug %}
    The project slug should not contain underscores, spaces or dots.
    {% endif %}

project_slug_snake_case:
  type: str
  default: "{{ project_slug.replace('-', '_') }}"
  when: false

project_version:
  type: str
  default: 0.0.0
  help: Enter a version number (0.0.0 for an empty template).

project_short_description:
  type: str
  default: ""
  help: Enter a short description.

github_user:
  type: str
  default: MaksHess
  help: What is your GitHub username (used for CODEOWNERS)?

github_name_with_owner:
  type: str
  default: "{{ github_user }}/{{ project_slug }}"
  when: false

author_name:
  type: str
  default: Max Hess
  help: What is your name (used for package author)?

author_email:
  type: str
  default: "hess.max.timo@gmail.com"
  help: What is your email (used for package author)?

github_url:
  type: str
  help: What is the GitHub url of this project?
  default: https://github.com/{{ github_name_with_owner }}
  validator: >-
    {% if not github_url.startswith('https://github.com/') or github_url.endswith('.git') %}
    The GitHub URL should start with `https://github.com/` and not end with `.git`, for example `https://github.com/LandoCalrissian/python-project`.
    {% endif %}

create_remote_repo:
  type: bool
  default: true
  help: Create a remote repo at {{ github_url }}? Fails if exists already.

minimal_python_version:
  type: str
  help: What is the minimal Python version you want to support?
  choices:
    - py39
    - py310
    - py311
    - py312
    - py313
  default: py311

minimal_python_version_sortable:
  type: str
  default: "{{ minimal_python_version.replace('py39', 'py309') }}"
  when: false

use_devcontainer:
  type: bool
  help: Should this project use a devcontainer for development?
  default: false

add_autobump_workflow:
  type: bool
  help: Do you want to add a GitHub Workflow to automatically bump `pixi.lock`?
  default: true

_tasks:
  # Print Install Information
  - "pixi info"
  - "git --version"

  # Initialize git repo & commit seleton
  - ["git", "init", "--initial-branch=main", "."]
  - ["git", "add", "*"]
  - ["git", "commit", "-m", "Initial project skeleton"]

  # List remote repos in `.remote.repos.yml`
  - ["gh", "repo", "list", "--json", "name", "-q", ".[] | .name", "|", "rg", "{{ project_slug }}", "-c", "--include-zero"]

  - command: ["gh", "repo", "create", "{{ project_slug }}", "--private", "--source=.", "--remote=upstream"]
    when: "{{ _copier_answers.create_remote_repo == true }}"

  - command: ["git", "remote", "add", "origin", "{{ github_url }}"]
    when: "{{ _copier_answers.create_remote_repo == true }}"

  - command: ["git", "branch", "-M", "main"]
    when: "{{ _copier_answers.create_remote_repo == true }}"

  - command: ["git", "push", "-u", "origin", "main"]
    when: "{{ _copier_answers.create_remote_repo == true }}"
